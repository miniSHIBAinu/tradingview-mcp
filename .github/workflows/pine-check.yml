name: Pine Script check

# Triggers:
# - On push to main / chore/tdv-vps-foundation
# - On PR to main
# - Manual via Actions tab
on:
  push:
    branches: [main, chore/tdv-vps-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Static + offline analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        # The .github/workflows/ files are INSIDE the tradingview-mcp repo,
        # so the checkout root is already the project root. No working-directory needed.
        run: npm ci

      - name: Run unit tests
        # Use test:unit instead of test because test includes tests/e2e.test.js
        # which needs a live TradingView Desktop at CDP port 9333. CI has no TV.
        run: npm run test:unit

      - name: Static check Pine declarations (declare-before-use)
        run: |
          for f in scripts/current.v*.pine; do
            echo "Checking $f"
            node scripts/check-pine-declarations.mjs "$f" || exit 1
          done

      - name: Offline Pine static analysis
        # tv pine analyze doesn't need a running TV. Catches additional issues
        # beyond our custom declare-before-use checker.
        run: |
          for f in scripts/current.v*.pine; do
            echo "Analyzing $f"
            node src/cli/index.js pine analyze -f "$f" || exit 1
          done
